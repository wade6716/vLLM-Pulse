services:
  vllm-pulse:
    # Pull prebuilt image from GHCR (built by GitHub Actions) or build locally with `docker compose up --build`
    image: ghcr.io/wade6716/vllm-pulse:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vllm-pulse
    restart: unless-stopped
    ports:
      - "8080:8080"
    # Quickstart in built-in mock mode (no GPU required):
    command: ["--mock", "--port", "8080"]

    # Production multi-node example (uncomment volume & command below):
    # environment:
    #   - VLLM_API_KEY=${VLLM_API_KEY}
    # volumes:
    #   - ./configs/config.example.yaml:/etc/vllm-pulse/config.yaml:ro
    # command: ["--config", "/etc/vllm-pulse/config.yaml", "--port", "8080"]
